name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop black hole
        shell: pwsh
        run: ./build.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DesktopBlackHole-Windows
          path: dist/DesktopBlackHole.exe
